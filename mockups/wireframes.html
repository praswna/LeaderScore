<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeaderScore Wireframes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "WenQuanYi Zen Hei", sans-serif; color: #222; }
  .screen { width: 1280px; height: 800px; padding: 40px 0; position: relative; border-bottom: 1px dashed #ccc; }
  .wrap { width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .label { position: absolute; top: 10px; right: 16px; font-size: 13px; color: #aaa; }
  .nav { display: flex; gap: 24px; align-items: baseline; padding-bottom: 14px; border-bottom: 1.5px solid #222; }
  .nav b { font-weight: normal; font-size: 20px; flex: 1; }
  .nav span { color: #999; }
  .nav span.on { color: #222; text-decoration: underline; text-underline-offset: 6px; }
  h1 { font-weight: normal; font-size: 30px; }
  .muted { color: #999; font-size: 14px; }
  .line { border: 1.5px solid #222; border-radius: 6px; padding: 12px 14px; color: #999; }
  .btn { border: 1.5px solid #222; border-radius: 6px; padding: 12px; text-align: center; }
  .row { display: flex; align-items: center; gap: 16px; }
  .list > div { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #ddd; }
  .sp { flex: 1; }
  .chip { border: 1.5px solid #222; border-radius: 20px; padding: 6px 14px; }
  .chip.off { border-color: #ccc; color: #aaa; }
</style>
</head>
<body>

<template id="nav">
  <div class="nav"><b>LeaderScore</b><span data-k="rank">랭킹</span><span data-k="compare">비교</span><span data-k="mine">나만의 평가</span></div>
</template>

<!-- 1. 랭킹 -->
<section class="screen" data-nav="rank"><span class="label">01 랭킹</span>
  <div class="wrap">
    <div class="list">
      <div><span class="muted">1</span><span class="sp">세종</span><span>96</span></div>
      <div><span class="muted">2</span><span class="sp">지도자 B</span><span>88</span></div>
      <div><span class="muted">3</span><span class="sp">지도자 C</span><span>79</span></div>
      <div><span class="muted">4</span><span class="sp">지도자 D</span><span>61</span></div>
      <div><span class="muted">5</span><span class="sp">지도자 E</span><span>34</span></div>
    </div>
  </div>
</section>

<!-- 2. 상세 -->
<section class="screen" data-nav="rank"><span class="label">02 지도자 상세</span>
  <div class="wrap">
    <div class="row"><h1 class="sp">세종</h1><h1>96</h1></div>
    <div class="list" id="events"></div>
  </div>
</section>

<!-- 3. 나만의 평가 -->
<section class="screen" data-nav="mine"><span class="label">03 나만의 평가</span>
  <div class="wrap">
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <span class="chip">경제 ×2</span><span class="chip">인권 ×3</span>
      <span class="chip off">군사</span><span class="chip off">문화</span><span class="chip off">외교</span>
    </div>
    <div class="line">기준 직접 입력</div>
    <div class="btn">프롬프트 복사</div>
    <div class="line" style="height:120px">AI 응답 붙여넣기</div>
    <div class="row"><span class="sp muted">결과</span><h1>96 → 91</h1></div>
  </div>
</section>

<!-- 4. 비교 -->
<section class="screen" data-nav="compare"><span class="label">04 비교</span>
  <div class="wrap">
    <div class="row"><div class="line sp">세종</div><span class="muted">vs</span><div class="line sp">지도자 B</div></div>
    <div class="row" style="justify-content:space-around"><h1>96</h1><h1>88</h1></div>
    <div class="list" id="cmp"></div>
  </div>
</section>

<!-- 5. 관리자 -->
<section class="screen" data-nav=""><span class="label">05 관리자</span>
  <div class="wrap">
    <div class="line">지도자 선택</div>
    <div class="btn">채점 프롬프트 복사</div>
    <div class="line" style="height:120px">AI 응답 붙여넣기</div>
    <div class="btn">시트에 저장</div>
  </div>
</section>

<script>
  const nav = document.getElementById('nav');
  document.querySelectorAll('.screen').forEach(s => {
    const n = nav.content.cloneNode(true);
    n.querySelector(`[data-k="${s.dataset.nav}"]`)?.classList.add('on');
    s.querySelector('.wrap').prepend(n);
  });
  const bar = s => `<div style="width:200px;display:flex;justify-content:flex-start"><div style="height:8px;width:${Math.abs(s)*20}px;background:${s<0?'#fff':'#222'};border:1.5px solid #222"></div></div>`;
  document.getElementById('events').innerHTML = [['훈민정음 창제',10],['집현전 확대',7],['측우기 제작',6],['4군 개척',5],['사건 D',-3]]
    .map(([t,s]) => `<div><span class="sp">${t}</span>${bar(s)}<span style="width:36px;text-align:right">${s>0?'+':''}${s}</span></div>`).join('');
  document.getElementById('cmp').innerHTML = [['경제',8,6],['군사',5,9],['인권',9,4],['문화',10,5]]
    .map(([c,a,b]) => `<div><span style="width:40px">${a}</span><span class="sp muted" style="text-align:center">${c}</span><span style="width:40px;text-align:right">${b}</span></div>`).join('');
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeaderScore Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "WenQuanYi Zen Hei", sans-serif; color: #222; }
  .phone { width: 390px; height: 780px; border: 2px solid #222; border-radius: 28px; overflow: hidden;
           display: flex; flex-direction: column; margin: 20px; position: relative; }
  .muted { color: #999; }

  /* 시대 탭 — 좌우 스와이프 */
  .eras { display: flex; gap: 8px; padding: 18px 0 12px 16px; border-bottom: 1.5px solid #222; white-space: nowrap; overflow: hidden; }
  .era { border: 1.5px solid #ccc; color: #999; border-radius: 6px; padding: 6px 12px; font-size: 14px; }
  .era.on { border-color: #222; color: #222; }

  /* 지도자 카드 — 좌우 스와이프 */
  .track { flex: 1; display: flex; gap: 16px; padding: 18px 0 0 16px; overflow: hidden; }
  .card { flex: 0 0 330px; display: flex; flex-direction: column; border-right: 1.5px solid #222; padding-right: 16px; }
  .name { border: 1.5px solid #222; border-radius: 6px; padding: 10px; text-align: center; font-size: 20px; margin: 0 30px 16px; }
  .cols { flex: 1; display: flex; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
  .col + .col { border-left: 1.5px solid #222; }
  .head { border: 1.5px solid #222; border-radius: 6px; padding: 6px; text-align: center; font-size: 14px; }
  .item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e5e5e5; }

  .hint { position: absolute; font-size: 12px; color: #999; }

  /* 하단 메뉴 */
  .tabs { display: flex; justify-content: space-around; border-top: 1.5px solid #222; padding: 12px 0 18px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #999; }
  .tab i { width: 26px; height: 26px; border: 1.5px solid #999; border-radius: 50%; }
  .tab.on { color: #222; } .tab.on i { border-color: #222; }
</style>
</head>
<body>
<div class="phone">
  <div class="eras">
    <span class="era">고대</span><span class="era on">조선</span><span class="era">근대</span><span class="era">현대</span><span class="era">중세 유럽</span>
  </div>
  <span class="hint" style="top:14px;right:0;padding:8px 12px;background:#fff;font-size:18px;color:#222">→</span>

  <div class="track">
    <div class="card">
      <div class="name">세종</div>
      <div class="cols">
        <div class="col">
          <div class="head">공 +28</div>
          <div class="item"><span>훈민정음 창제</span><span>+10</span></div>
          <div class="item"><span>집현전 확대</span><span>+7</span></div>
          <div class="item"><span>측우기 제작</span><span>+6</span></div>
          <div class="item"><span>4군 개척</span><span>+5</span></div>
        </div>
        <div class="col">
          <div class="head">과 −5</div>
          <div class="item"><span>사건 D</span><span>−3</span></div>
          <div class="item"><span>사건 G</span><span>−2</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="name">태종</div>
      <div class="cols"><div class="col"><div class="head">공</div></div><div class="col"><div class="head">과</div></div></div>
    </div>
  </div>
  <span class="hint" style="top:440px;right:0;padding:4px 10px;background:#fff;font-size:18px;color:#222">→</span>

  <div class="tabs">
    <div class="tab on"><i></i>지도자</div>
    <div class="tab"><i></i>랭킹</div>
    <div class="tab"><i></i>AI 프롬프트</div>
    <div class="tab"><i></i>설정</div>
  </div>
</div>
</body>
</html>
